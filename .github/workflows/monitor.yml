name: Moniteur de stock

on:
  schedule:
    # Toutes les 15 min (UTC). GitHub retarde ou saute souvent les crons :
    # chaque exécution surveille donc pendant ~6 h (le maximum autorisé) et
    # la suivante, mise en attente par le groupe de concurrence, prend le
    # relais dès qu'elle se termine. Couverture quasi continue.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Une seule exécution à la fois ; la suivante attend au lieu d'annuler.
concurrency:
  group: moniteur
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  moniteur:
    name: Surveillance des boutiques
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # L'état (dispo/prix) est conservé entre deux exécutions pour n'alerter
      # qu'au passage en stock, jamais deux fois pour la même fiche.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-moniteur-${{ github.run_id }}
          restore-keys: |
            etat-moniteur-

      - name: Lancer le moniteur
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          # Plafond des produits sans plafond dans collection.json (les plafonds
          # par produit — ETB, UPC… — se règlent dans collection.json).
          PRIX_MAX: ${{ vars.PRIX_MAX }}
          # Langues de cartes acceptées : "fr" (défaut) ou "fr,en".
          LANGUES: ${{ vars.LANGUES || 'fr' }}
          # Durée d'une exécution (min), délai entre deux vérifications (s) et
          # entre deux recherches de nouvelles fiches dans les boutiques (min).
          DUREE_MINUTES: ${{ vars.DUREE_MINUTES || '350' }}
          INTERVALLE_SECONDES: ${{ vars.INTERVALLE_SECONDES || '30' }}
          DECOUVERTE_MINUTES: ${{ vars.DECOUVERTE_MINUTES || '15' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONUNBUFFERED: "1"
        run: python moniteur.py

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-moniteur-${{ github.run_id }}
