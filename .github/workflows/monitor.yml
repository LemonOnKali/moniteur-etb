name: Moniteur de stock

on:
  schedule:
    # Filet de sécurité. GitHub retarde ou saute souvent les crons (un
    # déclenchement toutes les 4 à 8 h en pratique) : c'est chaque exécution
    # qui lance la suivante en se terminant (étape « Passer le relais »). Le
    # cron ne sert qu'à repartir si la chaîne casse (run annulé ou en échec).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      relais:
        description: "Lancé par le run précédent (pas de résumé Discord)"
        type: boolean
        default: false

# Une seule exécution à la fois ; la suivante attend au lieu d'annuler.
concurrency:
  group: moniteur
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # étape « Passer le relais »

jobs:
  moniteur:
    name: Surveillance des boutiques
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # L'état (dispo/prix) est conservé entre deux exécutions pour n'alerter
      # qu'au passage en stock, jamais deux fois pour la même fiche.
      - name: Restaurer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-moniteur-${{ github.run_id }}
          restore-keys: |
            etat-moniteur-

      - name: Lancer le moniteur
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Salons dédiés (facultatifs, secret DISCORD_WEBHOOK_UPC ou WEBHOOK_UPC…) :
          # sans secret, l'alerte part dans DISCORD_WEBHOOK.
          DISCORD_WEBHOOK_UPC: ${{ secrets.DISCORD_WEBHOOK_UPC || secrets.WEBHOOK_UPC }}
          DISCORD_WEBHOOK_ETB: ${{ secrets.DISCORD_WEBHOOK_ETB || secrets.WEBHOOK_ETB }}
          DISCORD_WEBHOOK_MAGASINS: ${{ secrets.DISCORD_WEBHOOK_MAGASINS || secrets.WEBHOOK_MAGASINS }}
          DISCORD_WEBHOOK_AUTRES: ${{ secrets.DISCORD_WEBHOOK_AUTRES || secrets.WEBHOOK_AUTRES }}
          DISCORD_WEBHOOK_JOURNAL: ${{ secrets.DISCORD_WEBHOOK_JOURNAL || secrets.WEBHOOK_JOURNAL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          # Plafond des produits sans plafond dans collection.json (les plafonds
          # par produit — ETB, UPC… — se règlent dans collection.json).
          PRIX_MAX: ${{ vars.PRIX_MAX }}
          # Langues de cartes acceptées : "fr" (défaut) ou "fr,en".
          LANGUES: ${{ vars.LANGUES || 'fr' }}
          # Durée d'une exécution (min), délai entre deux vérifications (s) et
          # entre deux recherches de nouvelles fiches dans les boutiques (min).
          DUREE_MINUTES: ${{ vars.DUREE_MINUTES || '350' }}
          INTERVALLE_SECONDES: ${{ vars.INTERVALLE_SECONDES || '30' }}
          DECOUVERTE_MINUTES: ${{ vars.DECOUVERTE_MINUTES || '15' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENEMENT: ${{ inputs.relais && 'relais' || '' }}
          PYTHONUNBUFFERED: "1"
        run: python moniteur.py

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-moniteur-${{ github.run_id }}

      # La suivante attend dans le groupe de concurrence et démarre dès la fin de
      # celle-ci : pas de trou. Rien si le run a échoué ou été annulé (le cron
      # reprend), pour ne pas boucler sur une erreur ni relancer un arrêt voulu.
      - name: Passer le relais
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f relais=true
