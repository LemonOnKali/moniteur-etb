name: Tester les boutiques

# Lancement manuel uniquement : un seul passage, sans Discord, avec des
# extraits de chaque page pour vérifier qu'une boutique est bien détectée.
# - "ou" : github (serveurs GitHub) ou pc (ton runner auto-hébergé).
# - "page_liens" : optionnel, URL d'une page comparateur (« où acheter ») dont
#   on veut extraire les liens marchands au lieu de lancer le diagnostic.
on:
  workflow_dispatch:
    inputs:
      ou:
        description: "Où lancer le test"
        type: choice
        default: github
        options:
          - github
          - pc
      page_liens:
        description: "URL d'une page « où acheter » pour en extraire les liens (optionnel)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic des produits
    runs-on: ${{ inputs.ou == 'pc' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.ou != 'pc'
        with:
          python-version: "3.12"
      - name: Liens marchands de la page
        if: inputs.page_liens != ''
        env:
          PYTHONIOENCODING: utf-8
        run: python moniteur.py --liens "${{ inputs.page_liens }}"
      - name: Diagnostic
        if: inputs.page_liens == ''
        env:
          FICHIER_PRODUITS: ${{ inputs.ou == 'pc' && 'produits-pc.json' || 'produits.json' }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python moniteur.py --diagnostic
