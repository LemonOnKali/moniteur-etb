name: Tester les boutiques

# Lancement manuel uniquement : un seul passage, sans Discord.
# - "ou" : github (serveurs GitHub) ou pc (ton runner auto-hébergé).
# - "decouvrir" : optionnel, adresses de boutiques à tester (séparées par des
#   espaces) : plateforme détectée, fiches 30 ans trouvées, lignes à copier
#   dans boutiques.json.
# - "page_liens" : optionnel, URL d'une page comparateur (« où acheter ») dont
#   on veut extraire les liens marchands.
# - "essai_minutes" : optionnel, fait tourner le vrai moniteur ce nombre de
#   minutes, sans Discord, pour voir les cycles de vérification.
# Sans option : diagnostic complet de boutiques.json et produits.json.
on:
  workflow_dispatch:
    inputs:
      ou:
        description: "Où lancer le test"
        type: choice
        default: github
        options:
          - github
          - pc
      decouvrir:
        description: "Boutiques à tester, séparées par des espaces (optionnel)"
        type: string
        required: false
      page_liens:
        description: "URL d'une page « où acheter » pour en extraire les liens (optionnel)"
        type: string
        required: false
      essai_minutes:
        description: "Faire tourner le moniteur N minutes sans Discord (optionnel)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic
    runs-on: ${{ inputs.ou == 'pc' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      LANGUES: ${{ vars.LANGUES || 'fr' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: inputs.ou != 'pc'
        with:
          python-version: "3.12"
      - name: Tester des boutiques
        if: inputs.decouvrir != ''
        env:
          BOUTIQUES: ${{ inputs.decouvrir }}
        # Découpage volontaire sur les espaces : une adresse par argument.
        run: python moniteur.py --decouvrir $BOUTIQUES
      - name: Liens marchands de la page
        if: inputs.page_liens != ''
        env:
          PAGE: ${{ inputs.page_liens }}
        run: python moniteur.py --liens "$PAGE"
      - name: Essai du moniteur sans Discord
        if: inputs.essai_minutes != ''
        env:
          FICHIER_PRODUITS: ${{ inputs.ou == 'pc' && 'produits-pc.json' || 'produits.json' }}
          FICHIER_BOUTIQUES: ${{ inputs.ou == 'pc' && 'aucun' || 'boutiques.json' }}
          FICHIER_ETAT: etat-essai.json
          DUREE_MINUTES: ${{ inputs.essai_minutes }}
          INTERVALLE_SECONDES: ${{ vars.INTERVALLE_SECONDES || '30' }}
        run: python moniteur.py
      - name: Diagnostic complet
        if: inputs.decouvrir == '' && inputs.page_liens == '' && inputs.essai_minutes == ''
        env:
          FICHIER_PRODUITS: ${{ inputs.ou == 'pc' && 'produits-pc.json' || 'produits.json' }}
          FICHIER_BOUTIQUES: ${{ inputs.ou == 'pc' && 'aucun' || 'boutiques.json' }}
        run: python moniteur.py --diagnostic
